# Docker Compose configuration for data-sourcing-agent
# Generated by genproj (docker-container capability).
#
# Deploy with: docker compose up -d
# (On Synology, import this file as a Container Manager "Project".)
#
# The image reference uses your registry namespace (GitHub username/org for
# GHCR). For public packages no registry credentials are required on the host.

services:
  app:
    image: ghcr.io/nickbrett1/data-sourcing-agent:latest
    container_name: data-sourcing-agent
    restart: unless-stopped

    ports:
      - "0.0.0.0:8700:8700"

    environment:
      # Set your environment variables here or in a NAS-side .env file
      # (genproj never commits secrets). See .env.example.
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-http://litellm:4000}
      LITELLM_API_KEY: ${LITELLM_API_KEY}
      LITELLM_REGISTRATION_KEY: ${LITELLM_REGISTRATION_KEY}
      LITELLM_MODEL: ${LITELLM_MODEL:-deepseek-v4-flash}
      # The Validator's oracle. Without it the agent cannot call a request valid
      # or a cost known, so the container refuses to price anything (see
      # agent/validator.py). It is a secret: from a NAS-side .env, never the image.
      DATABENTO_API_KEY: ${DATABENTO_API_KEY}
      # The address the card advertises — the address LiteLLM DIALS from its own
      # vantage on `ai_proxy`, where this container's name resolves. Setting
      # `0.0.0.0` here would register green and fail every invocation (handover
      # memo §4). Override only with an address reachable FROM the proxy.
      A2A_CARD_URL: ${A2A_CARD_URL:-http://data-sourcing-agent:8700}
      # Where the gateway-assigned agent id is remembered between runs. Pointed
      # at the mount below so it survives a Watchtower recreate; the image-layer
      # default would not (agent/register.py).
      AGENT_STATE_DIR: ${AGENT_STATE_DIR:-/state}
      # The gate switch. Unset/blank = observe-only: the gate runs and logs its
      # verdict but nothing routes on it. "1" = enforce the ASK-PATH (a computed
      # reject is still only observed), at the D2 cut in the frozen rolling cutoff
      # `/state/gate-cutoff.json` when armed, else the provisional 0.91. Refreshed
      # by `python -m agent.cutoff`; without a frozen cutoff it still enforces at
      # the provisional cut. Move this line to go back to watching.
      GATE_ENFORCE: ${GATE_ENFORCE:-}
      # roost fleet visibility (optional). Blank = not in the fleet, and the
      # client is not built at all (fail-open). There is no derivable default:
      # roost is on a different Docker network (`roost_default`) from this
      # container (`ai_proxy`), so `nas` and `roost` do not resolve from here.
      # Set it to an address that does - see agent/README.md §roost.
      ROOST_HUB_URL: ${ROOST_HUB_URL:-}
      ROOST_AGENT_ID: ${ROOST_AGENT_ID:-}
      ROOST_ENABLED: ${ROOST_ENABLED:-true}
      ROOST_TOKEN_ENV: ${ROOST_TOKEN_ENV:-ROOST_AGENT_TOKEN}
      ROOST_AGENT_TOKEN: ${ROOST_AGENT_TOKEN:-}
    volumes:
      # Writable, so the remembered agent id survives a redeploy (§5.6). A
      # NAS-side .env sets AGENT_STATE_HOST_DIR to the deployed directory.
      - ${AGENT_STATE_HOST_DIR:-./state}:/state
      # The request book's write-only inbox (design memo data-request-book-v1
      # §4.1). The agent writes drafts here and NOWHERE else — it never sees
      # approved/, in_flight/ or done/, so there is no path from its output to a
      # spend. Point REQUESTS_INBOX_HOST_DIR at <book>/inbox on the NAS (the book
      # is a git repo autocommitted from the NAS host, not by this container).
      - ${REQUESTS_INBOX_HOST_DIR:-./requests-inbox}:/requests/inbox
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      # Homepage group: kept as "Services". nas-reach-mcp chose "MCP Servers",
      # but this is an A2A agent (a service on `ai_proxy`), not an MCP server, so
      # "Services" is the honest group. Decision recorded in deploy/README.md §9.
      - "homepage.group=Services"
      - "homepage.name=data-sourcing-agent"
      - "homepage.href=http://nas:8700/"
      - "homepage.widget.type=customapi"
      - "homepage.widget.url=http://localhost:8700/healthz"
      - "homepage.widget.mappings[0].field=status"
      - "homepage.widget.mappings[0].label=Status"
    networks:
      - ai_proxy

  # The grading service: the UI plus the read surface (`/api/summary`) that
  # Homepage and the Dagu job (deploy/dagu/gate-drift.yaml) consume. Same image,
  # different entrypoint, same state volume. Published on the LAN (0.0.0.0) by
  # decision (2026-10-07): there is NO AUTH, so it is read-only over the logs plus
  # grade writes — treat it as a trusted-LAN tool, not an internet-facing one.
  grader:
    image: ghcr.io/nickbrett1/data-sourcing-agent:latest
    container_name: data-sourcing-agent-grader
    restart: unless-stopped
    command: ["python", "-m", "agent.grader", "--host", "0.0.0.0", "--port", "8801"]
    ports:
      - "0.0.0.0:8801:8801"
    environment:
      AGENT_STATE_DIR: ${AGENT_STATE_DIR:-/state}
    volumes:
      - ${AGENT_STATE_HOST_DIR:-./state}:/state
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "homepage.group=Services"
      - "homepage.name=gate grader"
      - "homepage.href=http://nas:8801/"
      - "homepage.widget.type=customapi"
      - "homepage.widget.url=http://nas:8801/api/summary"
      - "homepage.widget.mappings[0].field=status"
      - "homepage.widget.mappings[0].label=Status"
      - "homepage.widget.mappings[1].field=issue"
      - "homepage.widget.mappings[1].label=Sync"
    networks:
      - ai_proxy

  # The gate-grader MCP over streamable-http, for mcphub — which cannot run a stdio
  # server: it spawns stdio inside its OWN container, where this image and /state
  # do not exist (it has no docker socket to exec into this one). So the same
  # gate-grader tools are exposed over HTTP instead, and mcphub registers the URL
  # `http://data-sourcing-agent-gate-grader:8802/mcp`. No host port: only
  # `ai_proxy` peers need to reach it. Same image, same state volume as `app`/`grader`.
  gate-grader:
    image: ghcr.io/nickbrett1/data-sourcing-agent:latest
    container_name: data-sourcing-agent-gate-grader
    restart: unless-stopped
    command: ["python", "-m", "agent.gate_grader", "--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8802"]
    environment:
      AGENT_STATE_DIR: ${AGENT_STATE_DIR:-/state}
    volumes:
      - ${AGENT_STATE_HOST_DIR:-./state}:/state
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - ai_proxy
networks:
  ai_proxy:
    external: true