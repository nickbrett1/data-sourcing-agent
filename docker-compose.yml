# Docker Compose configuration for data-sourcing-agent
# Generated by genproj (docker-container capability).
#
# Deploy with: docker compose up -d
# (On Synology, import this file as a Container Manager "Project".)
#
# The image reference uses your registry namespace (GitHub username/org for
# GHCR). For public packages no registry credentials are required on the host.

services:
  app:
    image: ghcr.io/nickbrett1/data-sourcing-agent:latest
    container_name: data-sourcing-agent
    restart: unless-stopped

    ports:
      - "0.0.0.0:8700:8700"

    environment:
      # Set your environment variables here or in a NAS-side .env file
      # (genproj never commits secrets). See .env.example.
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-http://litellm:4000}
      LITELLM_API_KEY: ${LITELLM_API_KEY}
      LITELLM_REGISTRATION_KEY: ${LITELLM_REGISTRATION_KEY}
      LITELLM_MODEL: ${LITELLM_MODEL:-deepseek-v4-flash}
      # The Validator's oracle. Without it the agent cannot call a request valid
      # or a cost known, so the container refuses to price anything (see
      # agent/validator.py). It is a secret: from a NAS-side .env, never the image.
      DATABENTO_API_KEY: ${DATABENTO_API_KEY}
      # The address the card advertises — the address LiteLLM DIALS from its own
      # vantage on `ai_proxy`, where this container's name resolves. Setting
      # `0.0.0.0` here would register green and fail every invocation (handover
      # memo §4). Override only with an address reachable FROM the proxy.
      A2A_CARD_URL: ${A2A_CARD_URL:-http://data-sourcing-agent:8700}
      # Where the gateway-assigned agent id is remembered between runs. Pointed
      # at the mount below so it survives a Watchtower recreate; the image-layer
      # default would not (agent/register.py).
      AGENT_STATE_DIR: ${AGENT_STATE_DIR:-/state}
    volumes:
      # Writable, so the remembered agent id survives a redeploy (§5.6). A
      # NAS-side .env sets AGENT_STATE_HOST_DIR to the deployed directory.
      - ${AGENT_STATE_HOST_DIR:-./state}:/state
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      # Homepage group: kept as "Services". nas-reach-mcp chose "MCP Servers",
      # but this is an A2A agent (a service on `ai_proxy`), not an MCP server, so
      # "Services" is the honest group. Decision recorded in deploy/README.md §9.
      - "homepage.group=Services"
      - "homepage.name=data-sourcing-agent"
      - "homepage.href=http://nas:8700/"
      - "homepage.widget.type=customapi"
      - "homepage.widget.url=http://localhost:8700/healthz"
      - "homepage.widget.mappings[0].field=status"
      - "homepage.widget.mappings[0].label=Status"
    networks:
      - ai_proxy
networks:
  ai_proxy:
    external: true