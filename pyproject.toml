[project]
name = "data-sourcing-agent"
version = "0.1.0"
description = "A data-sourcing-agent project generated with genproj"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic-ai>=2.40",
    # The A2A server. Pinned to the SAME version the LiteLLM gateway invokes us
    # with (litellm 1.105.0 -> a2a-sdk 1.1.0). Version skew between client and
    # server was the original defect (FastA2A 2.0.1 declared a 1.0 interface but
    # spoke the 0.3 wire); using the official SDK on both sides removes it by
    # construction, and pinning keeps it removed.
    #
    # The `[sqlite]` extra pulls SQLAlchemy + aiosqlite, which the durable task
    # store (a2a.server.tasks.DatabaseTaskStore) needs. Persisting tasks under
    # `$AGENT_STATE_DIR` is what makes roost's `history.*` survive a Watchtower
    # recreate - the whole point of answering sessions at all. Same pinned SDK
    # version, just with the extra.
    "a2a-sdk[sqlite]==1.2.1",
    # The HTTP surface for the SDK server (`create_jsonrpc_routes` /
    # `create_agent_card_routes` are Starlette routes; the dispatcher streams
    # via sse-starlette). Declared explicitly because `fasta2a`, which used to
    # pull them in, is gone.
    "starlette>=0.37",
    "sse-starlette>=2.0",
    "uvicorn>=0.30",
    "httpx>=0.27",
    # The roost fleet client (agent/roost.py) speaks roost protocol v1 over a
    # long-lived outbound WebSocket. Declared explicitly rather than relying on
    # it as a transitive of something else (it is only pulled in by google-genai
    # today, which nothing here depends on). `>=14` because this is the first
    # version whose client takes `additional_headers` (the kwarg the client uses).
    "websockets>=14"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# BOTH packages ship. The agent's real implementation lives in the top-level
# `agent/` package (it is what the image runs: `COPY . .` + `uvicorn
# agent.main:app`); `src/data_sourcing_agent/` is the generated stub. Listing
# both explicitly means `python -m build` packages the code that actually runs,
# instead of shipping the stub and calling the build green.
packages = ["data_sourcing_agent", "agent"]

[tool.setuptools.package-dir]
data_sourcing_agent = "src/data_sourcing_agent"
agent = "agent"

[tool.pytest.ini_options]
# `agent/` is a first-class test root alongside `tests/`: it is the code the
# image runs, and the roost client (`agent/roost.py`) is the most
# protocol-sensitive module in the repo. Tests still live in `tests/` (they
# import `agent` via `pythonpath` below), but naming `agent` here means a test
# co-located with the code it exercises is collected rather than silently
# ignored - which is exactly the blind spot this widening exists to close.
testpaths = ["tests", "agent"]
# Make the top-level `agent` package importable from the tests without an
# install, so the tests exercise the code the image runs.
pythonpath = ["."]

[tool.ruff]
src = ["src", "tests"]
# Pin the language level. Without it ruff infers target-version from
# requires-python, and target-gated rules (e.g. UP017 "use datetime.UTC") then
# switch on or off depending on how the config resolved.
target-version = "py311"

[tool.ruff.lint.isort]
# `agent` is first-party (the code the image runs) even though it is not under
# `src/`; without this, ruff sorts it among third-party imports.
known-first-party = ["agent", "data_sourcing_agent"]

[tool.ruff.lint]
# Pin the enforced rule set. Without an explicit select the enabled set is
# whatever ruff's built-in default is for the resolved target version, which
# also drifts between ruff releases - so the same source could pass locally
# and fail in CI (or vice versa). Written down here so `ruff check src tests`
# is deterministic and local lint agrees with CI. Update `select` (or add
# `ignore`) deliberately when you want a different rule set.
select = ["E4", "E7", "E9", "F", "B", "I", "UP"]
