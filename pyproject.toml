[project]
name = "data-sourcing-agent"
version = "0.1.0"
description = "A data-sourcing-agent project generated with genproj"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic-ai>=2.40",
    "fasta2a[pydantic-ai]>=2.0",
    "uvicorn>=0.30",
    "httpx>=0.27"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# BOTH packages ship. The agent's real implementation lives in the top-level
# `agent/` package (it is what the image runs: `COPY . .` + `uvicorn
# agent.main:app`); `src/data_sourcing_agent/` is the generated stub. Listing
# both explicitly means `python -m build` packages the code that actually runs,
# instead of shipping the stub and calling the build green.
packages = ["data_sourcing_agent", "agent"]

[tool.setuptools.package-dir]
data_sourcing_agent = "src/data_sourcing_agent"
agent = "agent"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Make the top-level `agent` package importable from the tests without an
# install, so the tests exercise the code the image runs.
pythonpath = ["."]

[tool.ruff]
src = ["src", "tests"]
# Pin the language level. Without it ruff infers target-version from
# requires-python, and target-gated rules (e.g. UP017 "use datetime.UTC") then
# switch on or off depending on how the config resolved.
target-version = "py311"

[tool.ruff.lint.isort]
# `agent` is first-party (the code the image runs) even though it is not under
# `src/`; without this, ruff sorts it among third-party imports.
known-first-party = ["agent", "data_sourcing_agent"]

[tool.ruff.lint]
# Pin the enforced rule set. Without an explicit select the enabled set is
# whatever ruff's built-in default is for the resolved target version, which
# also drifts between ruff releases - so the same source could pass locally
# and fail in CI (or vice versa). Written down here so `ruff check src tests`
# is deterministic and local lint agrees with CI. Update `select` (or add
# `ignore`) deliberately when you want a different rule set.
select = ["E4", "E7", "E9", "F", "B", "I", "UP"]
